<!DOCTYPE html>
<html>

<head>

<style>
.header {
    width: 100%;
    height: 25%;
    border: 1px solid #000;
    margin: 10px;
}

.left{
    width: 25%;
    height: 622px;
    border: 1px solid #f00;
    float: left;
    margin: 10px;
}

.section{
    display: flex;
    flex-direction: column;
}

.main{
    width: 100%;
    height: 400px;
    border: 1px solid #F5BE27;
    margin: 10px;
    position: relative;
}

.box-class{
    width: 100%;
    display: flex;
    position: relative;
}

.box1{
    width: 33.3%;
    height: 200px;
    border: 1px solid #2776F5;
    margin: 10px;
}

.box2{
    width: 33.3%;
    height: 200px;
    border: 1px solid #9F27F5;
    margin: 10px;
}

.box3{
    width: 33.3%;
    height: 200px;
    border: 1px solid #87F527;
    margin: 10px;
}

.footer{
    width: 100%;
    height: 50px;
    border: 1px solid #27F5F5;
    float: bottom;
    margin: 10px;
}

</style>

</head>

<body>
    <div class="header">
        <h1 style="text-align: center;">Header</h1>
    </div>

    <div class="left">
        <h1>Left</h1>
    </div>

    <div class="section">
        <div class="main">
            <h1 style="text-align: center;">Main</h1>
        </div>

        <div class="box-class">
            <div class="box1">
                <h1>Box1</h1>
            </div>

            <div class="box2">
                <h1>Box2</h1>
            </div>

            <div class="box3">
                <h1>Box3</h1>
            </div>
        </div>
    </div>

    <div class="footer">
        <h1 style="text-align: center;">Footer</h1>
    </div>
</body>

</html>
